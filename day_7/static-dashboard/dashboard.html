<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header" role="banner">
      <h1>Dashboard</h1>
    </header>

    <!-- Body (sidebar + main) -->
    <div class="app-body">
      <!-- Sidebar -->
      <aside class="app-sidebar" role="complementary">
        <nav>
          <ul>
            <li><a href="#">Menu Item 1</a></li>
            <li><a href="#">Menu Item 2</a></li>
            <li><a href="#">Menu Item 3</a></li>
          </ul>
        </nav>
      </aside>

      <!-- Main content -->
      <main class="app-main" role="main">
        <div class="dashboard-grid">
          <div class="stat-card">
            <h2>Card 1</h2>
            <p>Stat here</p>
          </div>
          <div class="stat-card">
            <h2>Card 2</h2>
            <p>Stat here</p>
          </div>
          <div class="stat-card">
            <h2>Card 3</h2>
            <p>Stat here</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer" role="contentinfo">
      <p>&copy; 2026 Dashboard</p>
    </footer>
  </div>
</body>
</html>
